<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaz Tools</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #d4d4d4;
      --accent: #50fa7b;
      --muted: #6b6b6b;
      --border: #1f1f1f;
      --card-bg: #121212;
      --card-hover: #1a1a1a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, Monaco, monospace;
      padding: 2rem 1rem;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }
    h1 {
      color: var(--accent);
      font-size: 1.5rem;
      letter-spacing: 0.1em;
      font-weight: normal;
    }
    h1::before { content: "// "; color: var(--muted); }
    .header-meta {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
    .tools {
      display: grid;
      gap: 1rem;
      grid-template-columns: 1fr;
    }
    @media (min-width: 600px) {
      .tools { grid-template-columns: repeat(2, 1fr); }
    }
    .tool-card {
      display: block;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1.25rem;
      text-decoration: none;
      color: var(--fg);
      transition: background 0.15s, border-color 0.15s;
    }
    .tool-card:hover {
      background: var(--card-hover);
      border-color: var(--accent);
    }
    .tool-card h2 {
      color: var(--accent);
      font-size: 1rem;
      font-weight: normal;
      margin-bottom: 0.5rem;
    }
    .tool-card h2::before { content: "> "; color: var(--muted); }
    .tool-summary {
      color: var(--fg);
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }
    .tool-meta {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .tag::before { content: "#"; }
    .empty {
      color: var(--muted);
      padding: 2rem;
      text-align: center;
      border: 1px dashed var(--border);
      grid-column: 1 / -1;
    }
    footer {
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      margin-top: 3rem;
      color: var(--muted);
      font-size: 0.75rem;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>chaz tools</h1>
      <div class="header-meta">{{TOOL_COUNT}} tools active · personal toolkit hub</div>
    </header>
    <main class="tools">
      {{TOOLS}}
    </main>
    <footer>
      <span>built {{BUILD_DATE}}</span>
      <span>v0.1</span>
    </footer>
  </div>
</body>
</html>
